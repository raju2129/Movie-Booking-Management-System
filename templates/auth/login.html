<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login – CineBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div id="toastBox" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;"></div>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-box"><i class="fas fa-film"></i></div>
      <h4>CineBook</h4>
      <p>Your entertainment hub</p>
    </div>
    <h2>Welcome</h2>
    <form id="loginForm" novalidate>
      <div class="field-group">
        <label>Email Address</label>
        <div class="field-wrap">
          <span class="field-icon"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" class="auth-input" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="field-group">
        <label>Password</label>
        <div class="field-wrap">
          <span class="field-icon"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" class="auth-input" placeholder="Your password" required>
          <button type="button" class="eye-btn" data-target="password"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" id="loginBtn" class="btn-auth">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </button>
    </form>
    <div class="auth-or">or</div>
    <div class="auth-switch">Don't have an account? <a href="/?showSignup=1">Sign Up</a></div>
    <div class="auth-switch mt-2"><a href="{{ url_for('public.home') }}" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Home</a></div>
    <div class="demo-box mt-3">
      <p class="mb-1 small fw-bold text-muted"><i class="fas fa-key me-1"></i>Demo Credentials</p>
      <p class="mb-0 small"><strong>Admin:</strong> admin@bookmyshow.com / Admin@123</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
