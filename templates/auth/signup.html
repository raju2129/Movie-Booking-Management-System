<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign Up – CineBook</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div id="toastBox" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;"></div>
<div class="auth-page">
  <div class="auth-card" style="max-width:500px">
    <div class="auth-logo">
      <div class="logo-box"><i class="fas fa-film"></i></div>
      <h4>CineBook</h4>
      <p>Create your account</p>
    </div>
    <h2>Join Now</h2>
    <form id="signupForm" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <div class="field-group">
            <label>Full Name</label>
            <div class="field-wrap">
              <span class="field-icon"><i class="fas fa-user"></i></span>
              <input type="text" id="name" class="auth-input" placeholder="Your full name" required>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="field-group">
            <label>Email Address</label>
            <div class="field-wrap">
              <span class="field-icon"><i class="fas fa-envelope"></i></span>
              <input type="email" id="email" class="auth-input" placeholder="you@example.com" required>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="field-group">
            <label>Phone</label>
            <div class="field-wrap">
              <span class="field-icon"><i class="fas fa-phone"></i></span>
              <input type="tel" id="phone" class="auth-input" placeholder="9876543210">
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="field-group">
            <label>City</label>
            <div class="field-wrap">
              <span class="field-icon"><i class="fas fa-map-marker-alt"></i></span>
              <input type="text" id="city" class="auth-input" placeholder="Mumbai">
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="field-group">
            <label>Password</label>
            <div class="field-wrap">
              <span class="field-icon"><i class="fas fa-lock"></i></span>
              <input type="password" id="password" class="auth-input" placeholder="Min 6 characters" required>
              <button type="button" class="eye-btn" data-target="password"><i class="fas fa-eye"></i></button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="field-group">
            <label>Confirm Password</label>
            <div class="field-wrap">
              <span class="field-icon"><i class="fas fa-lock"></i></span>
              <input type="password" id="confirmPassword" class="auth-input" placeholder="Repeat password" required>
              <button type="button" class="eye-btn" data-target="confirmPassword"><i class="fas fa-eye"></i></button>
            </div>
          </div>
        </div>
      </div>
      <button type="submit" id="signupBtn" class="btn-auth mt-2">
        <i class="fas fa-user-plus me-2"></i>Create Account
      </button>
    </form>
    <div class="auth-switch mt-3">Already have an account? <a href="javascript:void(0)" onclick="window.location.href='/?showLogin=1'">Login</a></div>
    <div class="auth-switch mt-2"><a href="{{ url_for('public.home') }}" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Home</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
